name: Valyaint
options:
  bundleIdPrefix: com.valyaint
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  Valyaint:
    type: application
    platform: iOS
    sources:
      - Valyaint
    settings:
      base:
        INFOPLIST_FILE: Valyaint/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.valyaint.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
